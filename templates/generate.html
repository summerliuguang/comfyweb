{% extends "base.html" %}
{% block title %}生成 - ComfyWeb{% endblock %}
{% block content %}
<div class="page-head">
  <h1 class="title is-4">生成</h1>
  <a class="button is-small" href="/workflows">管理工作流</a>
</div>

<div class="panel">
  <div class="field">
    <label class="label">工作流模板</label>
    <div class="control">
      <div class="select is-fullwidth">
        <select id="wfSelect">
          <option value="">— 选择模板 —</option>
          {% for w in workflows %}
          <option value="{{ w.id }}">{{ w.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    {% if not workflows %}
    <p class="hint">还没有模板。先到 <a href="/workflows/import">工作流 → 导入</a> 粘贴 ComfyUI「导出(API)」的 JSON。</p>
    {% endif %}
  </div>
  <div id="formArea"></div>
  <div id="submitRow" hidden>
    <div class="field">
      <label class="label">生成数量</label>
      <input class="input" id="countInput" type="number" min="1" max="100" value="1" inputmode="numeric">
    </div>
    <button class="button is-link is-fullwidth is-medium" id="btnGenerate">生成</button>
    <p class="task-err" id="genError" hidden></p>
  </div>
</div>

<div class="panel" id="tasksPanel" hidden>
  <h2 class="title is-5">任务</h2>
  <div id="taskList"><p class="empty">暂无任务</p></div>
</div>
{% endblock %}
{% block scripts %}
<script>window.ACTIVE_IDS = {{ active_ids | tojson }};</script>
<script src="/static/js/render.js"></script>
<script src="/static/js/lightbox.js"></script>
<script src="/static/js/generate.js"></script>
{% endblock %}
