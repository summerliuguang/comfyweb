<aside class="side">
  <div class="logo">ComfyWeb</div>
  <aside class="menu">
    <p class="menu-label">ComfyUI 生成站</p>
    <ul class="menu-list">
      <li><a href="/" class="{{ 'on' if active == 'generate' }}">生成</a></li>
      <li><a href="/workflows" class="{{ 'on' if active == 'workflows' }}">工作流</a></li>
      <li><a href="/models" class="{{ 'on' if active == 'models' }}">模型</a></li>
      <li><a href="/loras" class="{{ 'on' if active == 'loras' }}">LoRA</a></li>
      <li><a href="/gallery" class="{{ 'on' if active == 'gallery' }}">画廊</a></li>
      <li><a href="/settings" class="{{ 'on' if active == 'settings' }}">设置</a></li>
    </ul>
  </aside>
  <div class="status" id="connStateS" style="margin-top:1.1rem">ComfyUI</div>
  <div class="foot">ComfyWeb<br>家庭内网专用</div>
</aside>

<header class="topbar">
  <div class="topbar-left">
    <button class="topbar-icon" aria-label="打开菜单">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 6.5h16"/><path d="M4 12h11"/><path d="M4 17.5h16"/>
      </svg>
    </button>
    <span class="topbar-brand">ComfyWeb</span>
    <span class="conn-dot" id="connDotM" title="ComfyUI 连接状态"></span>
  </div>
  <span class="topbar-left">
    <button class="theme-quick" id="themeQuick" aria-label="切换日间夜间"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <span class="topbar-title" data-page-title>…</span>
  </span>
</header>
<div class="mnav-backdrop"></div>
<aside class="mnav-drawer">
  <div class="mnav-head">
    <span class="mnav-logo">ComfyWeb</span>
    <button class="mnav-close" aria-label="关闭菜单">×</button>
  </div>
  <aside class="menu">
    <p class="menu-label">ComfyUI 生成站</p>
    <ul class="menu-list">
      <li><a href="/" class="{{ 'on' if active == 'generate' }}">生成</a></li>
      <li><a href="/workflows" class="{{ 'on' if active == 'workflows' }}">工作流</a></li>
      <li><a href="/models" class="{{ 'on' if active == 'models' }}">模型</a></li>
      <li><a href="/loras" class="{{ 'on' if active == 'loras' }}">LoRA</a></li>
      <li><a href="/gallery" class="{{ 'on' if active == 'gallery' }}">画廊</a></li>
      <li><a href="/settings" class="{{ 'on' if active == 'settings' }}">设置</a></li>
    </ul>
    <p class="menu-label">外观</p>
    <div class="theme-seg" data-theme-seg>
      <button type="button" data-t="system">跟随系统</button>
      <button type="button" data-t="light">日间</button>
      <button type="button" data-t="dark">夜间</button>
    </div>
  </aside>
  <div class="foot">ComfyWeb<br>家庭内网专用</div>
</aside>
<script>
(function () {
  var backdrop = document.querySelector('.mnav-backdrop');
  var drawer = document.querySelector('.mnav-drawer');
  function setOpen(open) { document.body.classList.toggle('mnav-open', open); }
  document.querySelector('.topbar-icon').addEventListener('click', function () { setOpen(true); });
  backdrop.addEventListener('click', function () { setOpen(false); });
  drawer.querySelector('.mnav-close').addEventListener('click', function () { setOpen(false); });
  drawer.querySelectorAll('.menu-list a').forEach(function (a) {
    a.addEventListener('click', function () { setOpen(false); });
  });
  var t = document.querySelector('[data-page-title]');
  if (t) t.textContent = document.title.split(' - ')[0] || '';
  // 外观三档接 comfyweb 现有主题接口 window.comfyTheme(t);顶栏按钮日/夜快捷切换
  function syncSeg() {
    var mode;
    try { mode = localStorage.getItem('comfyweb.theme') || 'system'; } catch (e) { mode = 'system'; }
    document.querySelectorAll('[data-theme-seg] button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.t === mode);
    });
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    var q = document.getElementById('themeQuick');
    if (q) q.innerHTML = dark ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M19.1 4.9l-1.9 1.9M6.8 17.2l-1.9 1.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' : '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  }
  document.querySelectorAll('[data-theme-seg] button').forEach(function (b) {
    b.addEventListener('click', function () { window.comfyTheme(b.dataset.t); syncSeg(); });
  });
  var quick = document.getElementById('themeQuick');
  if (quick) quick.addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    window.comfyTheme(dark ? 'light' : 'dark');
    syncSeg();
  });
  syncSeg();
  // ComfyUI 连接状态:顶栏圆点 + 侧栏状态行,每 10 秒轮询
  function setConn(ok, tip) {
    var d = document.getElementById('connDotM');
    if (d) {
      d.classList.toggle('ok', ok);
      d.classList.toggle('bad', !ok);
      d.title = tip;
    }
    var s = document.getElementById('connStateS');
    if (s) {
      s.classList.toggle('ok', ok);
      s.classList.toggle('bad', !ok);
      s.textContent = ok ? 'ComfyUI 已连接' : 'ComfyUI 未连接';
      s.title = tip;
    }
  }
  function pollConn() {
    fetch('/api/status').then(function (r) { return r.json(); }).then(function (d) {
      var ok = d.ws === '已连接';
      setConn(ok, 'ComfyUI ' + (d.ws || ''));
    }).catch(function () { setConn(false, 'ComfyUI 未连接'); });
  }
  pollConn();
  setInterval(pollConn, 10000);
})();
</script>
