<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#3e7bfa">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<title>{% block title %}ComfyWeb{% endblock %}</title>
<script>
/* 主题模式:跟随系统/日间/夜间(localStorage),在样式表加载前应用避免闪白 */
(function () {
  function apply(t) {
    var dark = t === 'dark' ||
      (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var root = document.documentElement;
    if (dark) root.setAttribute('data-theme', 'dark');
    else root.removeAttribute('data-theme');
    root.style.colorScheme = dark ? 'dark' : 'light';
    /* 样式表加载前先把画布刷成主题底色,避免夜间模式闪白(色值须与 skin.css 的 --bg 一致) */
    root.style.background = dark ? '#12141c' : '#f6f7fb';
  }
  window.comfyTheme = apply;
  try { apply(localStorage.getItem('comfyweb.theme') || 'system'); } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/static/vendor/bulma.min.css">
<link rel="stylesheet" href="/static/css/skin.css">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="wrap">
  {% include "_menu.html" %}
  {% block content %}{% endblock %}
</div>
<script>
/* 图片加载失败(如 ComfyUI 侧文件已清理)时替换为占位图,避免裂图 */
document.addEventListener('error', function (e) {
  var t = e.target;
  if (t && t.tagName === 'IMG' && !t.dataset.err) {
    t.dataset.err = '1';
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    t.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96">' +
      '<rect width="96" height="96" fill="' + (dark ? '#1a1d28' : '#f1f3f8') + '"/>' +
      '<text x="48" y="50" font-size="11" text-anchor="middle" fill="#8a90a0">图片缺失</text></svg>');
  }
}, true);

/* 文本域随内容增高(提示词等),不用内部滚动条。
   程序化回填值后(generate.js 的草稿/再次生成)手动调 comfyAutosizeFit 重算 */
function comfyAutosizeFit(t) {
  t.style.height = 'auto';
  t.style.height = (t.scrollHeight + t.offsetHeight - t.clientHeight) + 'px';
}
function comfyAutosize(t) {
  if (t.dataset.autosize) { comfyAutosizeFit(t); return; }
  t.dataset.autosize = '1';
  t.addEventListener('input', function () { comfyAutosizeFit(t); });
  comfyAutosizeFit(t);
}
window.comfyAutosizeFit = comfyAutosizeFit;
document.querySelectorAll('textarea').forEach(comfyAutosize);
new MutationObserver(function (muts) {
  for (const m of muts) for (const n of m.addedNodes) {
    if (n.nodeType !== 1) continue;
    if (n.tagName === 'TEXTAREA') comfyAutosize(n);
    else if (n.querySelectorAll) n.querySelectorAll('textarea').forEach(comfyAutosize);
  }
}).observe(document.body, { childList: true, subtree: true });
{% block bodyscript %}{% endblock %}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
