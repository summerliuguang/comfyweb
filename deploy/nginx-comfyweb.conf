# ComfyWeb 局域网站点(https 29xxx -> 127.0.0.1:5012)
# 按实际情况修改:对外端口、server_name(本机内网 IP)、证书名
server {
    listen 29008 ssl;
    server_name _;

    # 明文 http 打到 ssl 端口时自动 301 到 https(导航页链接是 http://)
    error_page 497 =301 https://$host:$server_port$request_uri;

    ssl_certificate /etc/nginx/ssl/comfyweb.crt;
    ssl_certificate_key /etc/nginx/ssl/comfyweb.key;

    client_max_body_size 20M;

    # 内网无账号应用:nginx basic auth(凭据在 /etc/nginx/comfyweb.htpasswd)
    auth_basic "ComfyWeb";
    auth_basic_user_file /etc/nginx/comfyweb.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:5012;
        proxy_http_version 1.1;
        # $http_host 保留原始端口($host 会丢端口,导致应用的同源校验误判)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
    }
}
